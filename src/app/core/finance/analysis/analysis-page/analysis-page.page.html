<ion-header>
  <ion-toolbar>
    <ion-title>分析與規劃</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="analysis-content">
  <ion-segment [(ngModel)]="aiTab" (ionChange)="switchTab(aiTab)" mode="ios">
    <ion-segment-button value="stats_ai">
      <ion-label>📊 統計與 AI</ion-label>
    </ion-segment-button>
    <ion-segment-button value="plans">
      <ion-label>🎯 未來計畫</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div *ngIf="aiTab === 'stats_ai'">
    <app-analysis-statistics></app-analysis-statistics>
  </div>

  <div *ngIf="aiTab === 'plans'" class="plans-content">
    <ion-card style="border-radius: 16px; margin: 0 0 16px 0; box-shadow: none;">
      <ion-card-content class="add-plan-button" style="padding: 0;">
        <ion-button expand="block" color="primary" style="margin: 0;">
          <ion-icon name="add" slot="start"></ion-icon>
          新增未來計畫
        </ion-button>
      </ion-card-content>
    </ion-card>
    
    <ion-card style="border-radius: 16px; margin: 0; box-shadow: none; border: 1px dashed rgba(0,0,0,0.08);">
      <ion-card-content style="text-align: center; padding: 24px; color: var(--ion-color-medium);">
        <p style="margin: 0;">尚無未來計畫</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
